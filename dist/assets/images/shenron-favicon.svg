<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient pour le corps -->
    <radialGradient id="bodyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6ba32f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c23;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradient pour la tête -->
    <radialGradient id="headGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7db935;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a8f2a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradient pour les yeux -->
    <radialGradient id="eyeGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fond circulaire -->
  <circle cx="32" cy="32" r="32" fill="#1a2030"/>
  
  <!-- Corps serpentin de Shenron -->
  <ellipse cx="32" cy="45" rx="25" ry="15" fill="url(#bodyGradient)"/>
  <ellipse cx="32" cy="42" rx="22" ry="12" fill="url(#bodyGradient)" opacity="0.8"/>
  
  <!-- Tête de Shenron -->
  <ellipse cx="32" cy="28" rx="18" ry="14" fill="url(#headGradient)"/>
  
  <!-- Museau -->
  <ellipse cx="32" cy="32" rx="12" ry="8" fill="url(#headGradient)"/>
  
  <!-- Yeux rouges caractéristiques -->
  <ellipse cx="26" cy="25" rx="4" ry="5" fill="url(#eyeGradient)"/>
  <ellipse cx="38" cy="25" rx="4" ry="5" fill="url(#eyeGradient)"/>
  
  <!-- Pupils -->
  <ellipse cx="26" cy="24" rx="2" ry="3" fill="#000"/>
  <ellipse cx="38" cy="24" rx="2" ry="3" fill="#000"/>
  
  <!-- Reflets dans les yeux -->
  <ellipse cx="25" cy="22" rx="1" ry="1.5" fill="#fff" opacity="0.8"/>
  <ellipse cx="37" cy="22" rx="1" ry="1.5" fill="#fff" opacity="0.8"/>
  
  <!-- Narines -->
  <ellipse cx="28" cy="30" rx="1.5" ry="2" fill="#2d5016"/>
  <ellipse cx="36" cy="30" rx="1.5" ry="2" fill="#2d5016"/>
  
  <!-- Cornes dorées -->
  <polygon points="22,15 25,8 28,15" fill="#ffd700"/>
  <polygon points="36,15 39,8 42,15" fill="#ffd700"/>
  <polygon points="23,15 26,9 27,15" fill="#ffed4e"/>
  <polygon points="37,15 40,9 41,15" fill="#ffed4e"/>
  
  <!-- Moustaches dorées -->
  <path d="M15 28 Q10 30 5 32" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M49 28 Q54 30 59 32" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M15 32 Q8 34 3 36" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M49 32 Q56 34 61 36" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M17 36 Q12 38 8 40" stroke="#ffd700" stroke-width="1.5" fill="none"/>
  <path d="M47 36 Q52 38 56 40" stroke="#ffd700" stroke-width="1.5" fill="none"/>
  
  <!-- Écailles sur le front -->
  <ellipse cx="32" cy="18" rx="8" ry="3" fill="#7db935" opacity="0.6"/>
  <ellipse cx="32" cy="20" rx="6" ry="2" fill="#8bc940" opacity="0.4"/>
  
  <!-- Bouche/sourire -->
  <path d="M24 35 Q32 38 40 35" stroke="#2d5016" stroke-width="2" fill="none"/>
  
  <!-- Détails sur le corps -->
  <ellipse cx="20" cy="48" rx="3" ry="2" fill="#7db935" opacity="0.5"/>
  <ellipse cx="44" cy="48" rx="3" ry="2" fill="#7db935" opacity="0.5"/>
  <ellipse cx="32" cy="50" rx="4" ry="2" fill="#8bc940" opacity="0.4"/>
  
  <!-- Orbes mystiques autour -->
  <circle cx="8" cy="12" r="2" fill="#ffa500" opacity="0.7"/>
  <circle cx="56" cy="52" r="2" fill="#ffa500" opacity="0.7"/>
  <circle cx="52" cy="12" r="1.5" fill="#ff6600" opacity="0.6"/>
  <circle cx="12" cy="52" r="1.5" fill="#ff6600" opacity="0.6"/>
</svg>
